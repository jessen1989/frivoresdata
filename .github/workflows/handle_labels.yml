# Standalone audit workflow: tests which labels already exist on the
# Forgejo instance. Fetches all labels via the Forgejo API (JSON output)
# and prints them. Use this to inspect the current state before or
# after running create_label.yml.

name: Handle Labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      #- .forgejo/workflows/create_label.yml
      - .forgejo/workflows/handle_labels.yml
      - .forgejo/labels.yml
      #- .github/workflows/create_label.yml
      - .github/workflows/handle_labels.yml
      - .github/labels.yml
      #- .forgejo/workflow/create_label.yml

jobs:
  test-labels:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Check Github
        env:
          #GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          #FORGEJO_TOKEN: ${{ secrets.ISSUE_SECRET }}
          #FORGEJO_TOKEN: ${{ secrets.ISSUE_SECRET }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          FORGEJO_LABELS_FILE: .forgejo/labels.yml
          GITHUB_LABELS_FILE: .github/labels.yml
          FORGEJO_CREATE_LABEL: .forgejo/forgejo_create_label.yml
          GITHUB_CREATE_LABEL: .github/github_create_label.yml
        run: |
          GIT_PLATFORM="${SERVER_URL}"
          echo "${GIT_PLATFORM}"
          #CREATE_LABEL_FILE="${FORGEJO_CREATE_LABEL}"
          case "${GIT_PLATFORM}" in
            *"librelab"*)
              echo "Hi librelabber ${GIT_PLATFORM}"
              if [ ! -f .forgejo/workflows/create_label.yml ]; then
                cp ${FORGEJO_CREATE_LABEL} .forgejo/workflows/create_label.yml
              else
                echo "There are a create_label file"
                cat .forgejo/workflows/create_label.yml
              fi
              ls ${CREATE_LABEL}
              ;;
            *"github"*)
              echo "Hi ${GIT_PLATFORM}"
              if [ ! -f .github/workflows/create_label.yml ]; then
                cp ${GITHUB_CREATE_LABEL} .github/create_label.yml
                ls -Fla
              else
                echo "There are a create_label file"
                ls -Fla
                cat .github/workflows/create_label.yml
              fi
              echo "Run again if this is the first time running"
              ;;
            *)
              echo "Platform Supported reach out to librelab for any questions!"
              ;;
          esac
