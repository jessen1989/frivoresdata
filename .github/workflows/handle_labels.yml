---
# Standalone audit workflow: tests which labels already exist on the
# Forgejo instance. Fetches all labels via the Forgejo API (JSON output)
# and prints them. Use this to inspect the current state before or
# after running create_label.yml.

name: Handle Labels

on:
  workflow_dispatch:

jobs:
  test-labels:
    runs-on: self-hosted
    steps:
      - name: Install JQ
        run: |
          apt update
          apt install jq -y
          jq --version
      - name: Test which labels already exist
        env:
          FORGEJO_TOKEN: ${{ secrets.ISSUE_SECRET }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Forgejo API base: {server}/api/v1
          API_URL="${SERVER_URL}/api/v1"
          # GET all existing labels from the Forgejo API (JSON output)
          LABELS_URL="${API_URL}/repos/${REPO}/labels"
          echo "Requesting: ${LABELS_URL}"
          if [ -z "${FORGEJO_TOKEN}" ]; then
            echo "ERROR: FORGEJO_TOKEN is empty - check the repository secret."
            exit 1
          fi
          http_code="$(curl -sS -o /tmp/labels.json -w '%{http_code}' \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Accept: application/json" \
            "${LABELS_URL}")"
          if [ "${http_code}" != "200" ]; then
            echo "ERROR: Forgejo API returned HTTP ${http_code}"
            echo "Response body:"
            cat /tmp/labels.json
            exit 1
          fi
          existing_labels="$(cat /tmp/labels.json)"
          echo "Labels currently on Forgejo:"
          echo "${existing_labels}" | jq 'map({name, description, color})'
          echo "Summary:"
          echo "${existing_labels}" | jq -r 'map(.name) | .[]'
