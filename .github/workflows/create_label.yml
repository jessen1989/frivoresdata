---
# Defines the labels (name, description, color) and creates each one
# that does not already exist on GitHub. The workflow GETs all existing
# labels from the GitHub API, tests for a match with jq, and POSTs the
# label only if it is missing, PATCHes it when it differs, and deletes
# labels that are not declared in the file.
#
# Colors are hex values without the leading '#', e.g. "00aabb".

name: Create Labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create_label.yml
      - .github/workflows/handle_labels.yml
      - .github/labels.yml

permissions:
  issues: write

jobs:
  create-label:
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      API_URL: https://api.github.com
      REPO: ${{ github.repository }}
      LABELS_FILE: .github/labels.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install curl and jq
        run: |
          apt update && apt install -y curl jq
          jq --version

      - name: Install yq
        uses: mikefarah/yq@v4.54.3

      - name: Verify yq
        run: yq --version

      - name: Create or update labels
        run: |
          set -euo pipefail

          auth_header="Authorization: Bearer ${GH_TOKEN}"
          api_version_header="X-GitHub-Api-Version: 2022-11-28"
          accept_header="Accept: application/vnd.github+json"

          # Convert the YAML label definitions to JSON for jq
          yq -o=json '.labels' "${LABELS_FILE}" > /tmp/labels.json
          label_count="$(jq length /tmp/labels.json)"
          echo "Found ${label_count} labels in ${LABELS_FILE}"

          # GET all existing labels from the GitHub API (follow pagination)
          page=1
          existing_labels="[]"
          while :; do
            response="$(curl -sfS -H "${auth_header}" -H "${accept_header}" \
              -H "${api_version_header}" \
              "${API_URL}/repos/${REPO}/labels?per_page=100&page=${page}")"
            count="$(echo "${response}" | jq length)"
            if [ "${count}" -eq 0 ]; then
              break
            fi
            existing_labels="$(jq -n \
              --argjson acc "${existing_labels}" \
              --argjson page "${response}" \
              '$acc + $page')"
            page="$((page + 1))"
          done

          echo "Labels currently on GitHub:"
          echo "${existing_labels}" | jq 'map(.name)'

          i=0
          while [ "${i}" -lt "${label_count}" ]; do
            label_json="$(jq -c ".[${i}]" /tmp/labels.json)"
            i="$((i + 1))"

            LABEL_NAME="$(jq -r '.name' <<< "${label_json}")"
            LABEL_DESCRIPTION="$(jq -r '.description // ""' <<< "${label_json}")"
            color="$(jq -r '.color' <<< "${label_json}" | tr -d '#' | tr '[:upper:]' '[:lower:]')"

            existing="$(echo "${existing_labels}" | jq --arg name "${LABEL_NAME}" \
              'map(select(.name == $name))[0]')"

            if [ "${existing}" = "null" ]; then
              echo "Label '${LABEL_NAME}' does not exist - creating it."
              body="$(jq -n --arg name "${LABEL_NAME}" \
                --arg description "${LABEL_DESCRIPTION}" \
                --arg color "${color}" \
                '{name: $name, description: $description, color: $color}')"
              curl -sfS -X POST -H "${auth_header}" -H "${accept_header}" \
                -H "${api_version_header}" \
                -H "Content-Type: application/json" \
                -d "${body}" "${API_URL}/repos/${REPO}/labels" \
                | jq '{name, description, color}'
              continue
            fi

            existing_color="$(echo "${existing}" | jq -r '.color' | tr -d '#' | tr '[:upper:]' '[:lower:]')"
            existing_description="$(echo "${existing}" | jq -r '.description // ""')"

            if [ "${existing_color}" = "${color}" ] && [ "${existing_description}" = "${LABEL_DESCRIPTION}" ]; then
              echo "Label '${LABEL_NAME}' already exists with the same color and description - no change needed."
              continue
            fi

            echo "Label '${LABEL_NAME}' exists but differs - updating it."
            echo "  color: ${existing_color} -> ${color}"
            echo "  description: ${existing_description} -> ${LABEL_DESCRIPTION}"
            body="$(jq -n --arg description "${LABEL_DESCRIPTION}" \
              --arg color "${color}" \
              '{description: $description, color: $color}')"
            curl -sfS -X PATCH -H "${auth_header}" -H "${accept_header}" \
              -H "${api_version_header}" \
              -H "Content-Type: application/json" \
              -d "${body}" \
              "${API_URL}/repos/${REPO}/labels/$(jq -rn --arg v "${LABEL_NAME}" '$v|@uri')" \
              | jq '{name, description, color}'
          done

          # Prune: delete labels on GitHub that are not in the file
          undeclared_names="$(echo "${existing_labels}" | jq --slurpfile desired /tmp/labels.json \
            '[.[] | select(.name as $n | ($desired[0] | map(.name) | index($n)) | not) | .name]')"
          undeclared_count="$(echo "${undeclared_names}" | jq length)"

          if [ "${undeclared_count}" -gt 0 ]; then
            echo "Labels on GitHub that are not in ${LABELS_FILE} - deleting:"
            echo "${undeclared_names}" | jq -r '.[] | "  - " + .'
            for name in $(echo "${undeclared_names}" | jq -r '.[]'); do
              curl -sfS -X DELETE -H "${auth_header}" -H "${accept_header}" \
                -H "${api_version_header}" \
                "${API_URL}/repos/${REPO}/labels/$(jq -rn --arg v "${name}" '$v|@uri')"
            done
          else
            echo "No undeclared labels - nothing to prune."
          fi

          echo "All labels reconciled."
